name: Build V Spoofer
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash build.sh
      - name: Upload flashable module
        uses: actions/upload-artifact@v4
        with:
          name: V_Spoofer_v2.0
          path: out/module/
