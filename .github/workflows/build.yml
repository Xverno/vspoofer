name: Build V Spoofer
on:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash build.sh
      - name: Upload flashable module
        uses: actions/upload-artifact@v4
        with:
          name: V_Spoofer_v2.0
          path: out/module/
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep '^version=' module/module.prop | cut -d= -f2)
          if gh release view "$VER" >/dev/null 2>&1; then
            gh release upload "$VER" out/V_Spoofer_v2.0.zip --clobber
          else
            gh release create "$VER" out/V_Spoofer_v2.0.zip --title "V Spoofer $VER" --notes "Per-game device spoofer for rooted Android (Magisk/KernelSU, Zygisk). By @Xverno - t.me/VernoTalks"
          fi
